name: Prod Deployment

on: 
  push:
    branches:
      - main
  pull_request:
    types:
      - closed
    branches:
    - main


jobs: 
  build: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout code 
        uses: actions/checkout@v5

      - name: Set up node js 
        uses: actions/setup-node@v6
        with: 
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend 
          npm install 
          npm run build

      - name: Set up go lang 
        uses: actions/setup-go@v6

      - name: Build backend 
        run: |
          cd backend 
          go mod tidy 
          go build 

  deploy: 
    runs-on: ubuntu-latest
    needs: build 
    steps: 
    - name: Checkout code 
      uses: actions/checkout@v5

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H 20.244.20.98 >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        ssh -o StrictHostKeyChecking=no azureuser@20.244.20.98 << EOF
          echo "Successfully SSH'd into the server!"
        EOF


        
    
      
          
      
